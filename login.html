<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaces Boutique — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .auth-header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #12161f;
            border-bottom: 2px solid #d4af37;
            padding: 15px 30px;
            display: flex;
            align-items: center;
        }
        .brand-logo {
            font-family: 'Playfair Display', serif;
            color: #ffffff;
            font-size: 1.25rem;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .brand-logo span {
            color: #d4af37;
            margin-right: 10px;
        }
        .auth-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
        .card-title {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: #12161f;
        }
        .form-control {
            border-radius: 8px;
            padding: 11px;
            border: 1px solid #dee2e6;
            background-color: #fcfcfc;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #12161f;
            background-color: #fff;
        }
        .btn-dark-custom {
            background-color: #12161f;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-dark-custom:hover {
            background-color: #262c3a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="auth-header-bar">
        <div class="brand-logo">
            <span>S</span> | SOLACES BOUTIQUE
        </div>
    </div>

    <div class="container d-flex justify-content-center align-items:center;">
        <div class="card auth-card">
            <div class="text-center mb-4">
                <h3 class="card-title mb-1">Welcome Back</h3>
                <p class="text-muted small">Sign in to access your inventory control</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginUser" class="form-label small fw-semibold text-secondary">Username</label>
                    <input type="text" class="form-control" id="loginUser" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label for="loginPass" class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" class="form-control" id="loginPass" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-dark-custom w-100">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;

            let users = JSON.parse(localStorage.getItem('solaces_users')) || [];

            if(users.length === 0) {
                users.push({ username: 'admin', password: 'admin123' });
                localStorage.setItem('solaces_users', JSON.stringify(users));
            }

            const found = users.find(u => u.username === user && u.password === pass);

            if(found) {
                localStorage.setItem('currentUser', JSON.stringify(found));
                alert(`Welcome back, ${found.username}!`);
                window.location.href = 'index.html'; 
            } else {
                alert('Invalid username or password.');
            }
        });
    </script>
</body>
</html>
